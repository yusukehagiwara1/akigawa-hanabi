<!-- wp:html -->
<style>
.akg-quiz{box-sizing:border-box;max-width:100%;margin:0;padding:16px 12px;border:1px solid #000;background:#fff;color:#000;font-size:14px;font-size:max(14px,1em);line-height:1.7;overflow-wrap:break-word;word-wrap:break-word}
.akg-quiz *,.akg-quiz *::before,.akg-quiz *::after{box-sizing:border-box}
.akg-quiz [hidden]{display:none}
@media (min-width:600px){.akg-quiz{padding:24px 28px}}
.akg-quiz .akg-quiz__lead{margin:0 0 1em;text-align:center}
.akg-quiz .akg-quiz__progress{display:flex;align-items:center;gap:10px;margin:0 0 1em;font-size:.85em}
.akg-quiz .akg-quiz__step{white-space:nowrap}
.akg-quiz .akg-quiz__bar{flex:1;display:block;height:4px;background:var(--color_border,hsla(0,0%,78%,.5));overflow:hidden}
.akg-quiz .akg-quiz__bar i{display:block;height:100%;background:#000;transition:width .25s ease}
@media (prefers-reduced-motion:reduce){.akg-quiz .akg-quiz__bar i{transition:none}}
.akg-quiz .akg-quiz__panel{margin:0}
.akg-quiz .akg-quiz__q{font-weight:700;font-size:1.15em;line-height:1.5;margin:0 0 .75em;outline:none}
.akg-quiz .akg-quiz__hint{font-size:.9em;margin:-.25em 0 .75em}
.akg-quiz .akg-quiz__opts{display:grid;grid-template-columns:1fr;gap:10px;margin:0 0 .75em}
@media (min-width:600px){.akg-quiz .akg-quiz__opts{grid-template-columns:1fr 1fr;gap:12px}.akg-quiz .akg-quiz__opts.-col1{grid-template-columns:1fr;max-width:32em}}
.akg-quiz .akg-quiz__opt,.akg-quiz .akg-quiz__alt-btn{display:block;width:100%;min-height:56px;margin:0;padding:12px 16px;border:1px solid #000;border-radius:4px;background:#fff;color:#000;text-align:left;font:inherit;line-height:1.5;cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
@media (hover:hover){.akg-quiz .akg-quiz__opt:hover,.akg-quiz .akg-quiz__alt-btn:hover{background:#000;color:#fff}}
.akg-quiz .akg-quiz__opt:active,.akg-quiz .akg-quiz__alt-btn:active{background:#000;color:#fff}
.akg-quiz .akg-quiz__opt:focus-visible,.akg-quiz .akg-quiz__alt-btn:focus-visible,.akg-quiz .akg-quiz__back:focus-visible,.akg-quiz .akg-quiz__again:focus-visible,.akg-quiz a:focus-visible{outline:3px solid var(--color_deep02,#3d79d5);outline-offset:2px}
.akg-quiz .akg-quiz__opt-main{display:block;font-weight:700}
.akg-quiz .akg-quiz__opt-sub{display:block;font-size:.85em;opacity:.85;margin-top:2px}
.akg-quiz .akg-quiz__back{display:inline-flex;align-items:center;min-height:44px;margin:0;padding:0 4px;border:0;background:none;color:var(--color_link,#1e73be);font:inherit;font-size:.9em;text-decoration:underline;cursor:pointer;-webkit-appearance:none;appearance:none}
.akg-quiz .akg-quiz__result{margin:0}
.akg-quiz .akg-quiz__picked{font-size:.85em;margin:0 0 .5em;color:#555}
.akg-quiz .akg-quiz__label{display:inline-block;background:#000;color:#fff;font-size:.8em;font-weight:700;padding:.15em .8em;margin:0 0 .5em}
.akg-quiz .akg-quiz__seat{font-size:1.4em;font-weight:700;line-height:1.35;margin:0 0 .2em;outline:none}
.akg-quiz .akg-quiz__catch{color:#c62828;font-weight:700;margin:0 0 .9em}
.akg-quiz .akg-quiz__body{display:grid;grid-template-columns:1fr;gap:12px;margin:0 0 1em}
@media (min-width:600px){.akg-quiz .akg-quiz__body{grid-template-columns:5fr 7fr;gap:20px;align-items:start}}
.akg-quiz .akg-quiz__fig{margin:0;padding:0}
.akg-quiz .akg-quiz__fig img{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;background:var(--color_gray,hsla(0,0%,78%,.15))}
.akg-quiz .akg-quiz__price{font-size:1.2em;font-weight:700;line-height:1.4;margin:0 0 .5em}
.akg-quiz .akg-quiz__spec{list-style:none;margin:0 0 .75em;padding:0;font-size:.9em}
.akg-quiz .akg-quiz__spec li{position:relative;padding-left:1.1em;margin:0;line-height:1.6}
.akg-quiz .akg-quiz__spec li::before{content:"・";position:absolute;left:0}
.akg-quiz .akg-quiz__why{margin:0}
.akg-quiz .swell-block-button{margin:0 0 .5em}
.akg-quiz .swell-block-button.red_{--the-btn-color:#d40000}
.akg-quiz .swell-block-button__link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:min(100%,22em);max-width:100%;background:var(--the-btn-bg,#d40000);color:#fff;font-weight:700;text-decoration:none;border-radius:var(--the-btn-radius,80px)}
.akg-quiz .akg-quiz__sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.akg-quiz .akg-quiz__cta-hint{font-size:.85em;text-align:center;margin:0 0 .25em}
.akg-quiz .akg-quiz__sub{font-size:.9em;text-align:center;margin:0 0 1em}
.akg-quiz .akg-quiz__sub a{display:inline-block;min-height:44px;line-height:44px;text-decoration:underline;color:var(--color_link,#1e73be)}
.akg-quiz .akg-quiz__alt{border-top:1px solid var(--color_border,hsla(0,0%,78%,.5));padding-top:1em;margin:0 0 1em}
.akg-quiz .akg-quiz__alt-label{font-size:.85em;font-weight:700;margin:0 0 .5em}
.akg-quiz .akg-quiz__note{font-size:.85em;margin:.5em 0 0;color:#555}
.akg-quiz .akg-quiz__foot{margin:1em 0 0}
.akg-quiz .akg-quiz__again{display:inline-flex;align-items:center;min-height:44px;margin:0;padding:0 1.5em;border:1px solid #000;border-radius:80px;background:#fff;color:#000;font:inherit;font-weight:700;cursor:pointer;-webkit-appearance:none;appearance:none}
/* Seat cards (SS/S/A) further down the page: make the small "other sales sites" link tall enough to tap (about 45px) */
.post_content .akg-sublink a{display:inline-block;box-sizing:border-box;min-height:44px;padding:.65em 0}
</style>
<div class="akg-quiz" id="akg-quiz" role="region" aria-label="座席診断">
  <p class="akg-quiz__lead">2～3つの質問に答えるだけで、おすすめの席をご案内します。</p>
  <div class="akg-quiz__progress" aria-hidden="true">
    <span class="akg-quiz__step" data-akg="step">質問 1 / 2</span>
    <span class="akg-quiz__bar"><i data-akg="bar" style="width:33%"></i></span>
  </div>
  <p class="akg-quiz__sr" data-akg="status" aria-live="polite" aria-atomic="true"></p>
  <div class="akg-quiz__panel" data-akg="panel">
    <p class="akg-quiz__q" id="akg-quiz-q" tabindex="-1">どなたと観覧しますか？</p>
    <div class="akg-quiz__opts" role="group" aria-labelledby="akg-quiz-q">
      <button type="button" class="akg-quiz__opt" data-q="with" data-v="family"><span class="akg-quiz__opt-main">家族で</span><span class="akg-quiz__opt-sub">お子さま連れ、ご両親とご一緒の方も</span></button>
      <button type="button" class="akg-quiz__opt" data-q="with" data-v="friends"><span class="akg-quiz__opt-main">友人・グループで</span><span class="akg-quiz__opt-sub">お仲間や同僚と</span></button>
      <button type="button" class="akg-quiz__opt" data-q="with" data-v="couple"><span class="akg-quiz__opt-main">カップル・ご夫婦で</span><span class="akg-quiz__opt-sub">ふたりで</span></button>
      <button type="button" class="akg-quiz__opt" data-q="with" data-v="solo"><span class="akg-quiz__opt-main">おひとりで</span><span class="akg-quiz__opt-sub">1名でゆっくり</span></button>
    </div>
  </div>
  <p class="akg-quiz__note" data-akg="note">※おすすめは目安です。</p>
  <noscript><p class="akg-quiz__note">この診断はJavaScriptが有効な環境でご利用いただけます。席の説明は、このページ下の「観覧席」をご覧ください。<a href="#site">販売サイトの一覧を見る</a></p></noscript>
</div>
<script src="https://akigawa-hanabi.pages.dev/wp-snippets/seat-quiz.js?v=20260906a" defer></script>
