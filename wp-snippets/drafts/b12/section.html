<!-- wp:paragraph -->
<p>花火は18時から19時頃まで、約1時間で5,000発を打ち上げる予定です。音楽に合わせて打ち上がる演出が特徴で、第8回（2026年）は映画『ズートピア2』の「Zoo」で幕を開け、平原綾香「Jupiter」で締めくくる予定です。</p>
<!-- /wp:paragraph -->

<!-- wp:paragraph -->
<p>2026年9月13日時点の予定です。曲目・順番は変更になる場合があります。</p>
