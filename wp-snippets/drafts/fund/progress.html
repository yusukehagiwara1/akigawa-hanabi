<style>
.akg-fund,.akg-fund *,.akg-fund *::before,.akg-fund *::after{box-sizing:border-box}
.akg-fund{max-width:100%;margin:0 0 1.75em;padding:1.3em 1.3em 1.4em;border:1px solid #e0e0e0;border-top:4px solid #ffb400;border-radius:0;background:#ffffff;color:#222222;line-height:1.7;overflow-wrap:break-word;word-wrap:break-word;font-feature-settings:"tnum"}
.akg-fund p{margin:0;padding:0}
.akg-fund .akg-fund__ttl{margin:0 0 .9em;font-size:.82em;font-weight:700;letter-spacing:.14em;line-height:1.4;color:#8a6a00}
.akg-fund__nums{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.4em 1.5em;margin:0 0 .7em}
.akg-fund .akg-fund__amount{display:flex;align-items:baseline;gap:.15em;line-height:1}
.akg-fund__amount b{font-size:2.6em;font-weight:700;letter-spacing:-.02em;line-height:1}
.akg-fund__amount span{font-size:1em;font-weight:700}
.akg-fund .akg-fund__rate{display:flex;align-items:baseline;gap:.3em;line-height:1;color:#8a6a00}
.akg-fund__rate em{font-style:normal;font-size:.78em;font-weight:700;letter-spacing:.06em;color:#555555}
.akg-fund__rate b{font-size:1.9em;font-weight:700;letter-spacing:-.02em;line-height:1}
.akg-fund__bar{position:relative;display:block;width:100%;height:16px;background:#f2f2f2;border-right:2px solid #222222;overflow:hidden}
.akg-fund__bar i{display:block;height:100%;background:#ffb400}
.akg-fund .akg-fund__scale{display:flex;justify-content:space-between;gap:1em;margin:.35em 0 0;font-size:.74em;letter-spacing:.02em;color:#777777}
.akg-fund__scale b{font-weight:700;color:#444444}
.akg-fund .akg-fund__rest{margin:.9em 0 0;font-size:.92em;font-weight:700;line-height:1.6}
.akg-fund__rest span{color:#8a6a00}
.akg-fund .akg-fund__note{margin:.8em 0 0;padding-top:.8em;border-top:1px solid #efefef;font-size:.82em;line-height:1.75;color:#555555}
.akg-fund a.akg-fund__cta{display:flex;align-items:center;justify-content:center;gap:.4em;min-height:56px;margin:1em 0 0;padding:.7em 1.2em;border:1px solid #222222;background:#222222;color:#ffffff;font-weight:700;text-align:center;text-decoration:none}
.akg-fund a.akg-fund__cta:hover,.akg-fund a.akg-fund__cta:active{color:#ffffff;text-decoration:none;opacity:.85}
@media (min-width:600px){
.akg-fund{padding:1.6em 1.8em 1.7em}
.akg-fund__amount b{font-size:3.2em}
.akg-fund__rate b{font-size:2.2em}
.akg-fund__bar{height:18px}
}
</style>
<div class="akg-fund">
<p class="akg-fund__ttl">協賛金の受付状況</p>
<div class="akg-fund__nums">
<p class="akg-fund__amount"><b>8,250,000</b><span>円</span></p>
<p class="akg-fund__rate"><em>達成率</em><b>63</b><span>%</span></p>
</div>
<div class="akg-fund__bar"><i style="width:63%"></i></div>
<p class="akg-fund__scale"><span>0円</span><span>目標 <b>13,000,000円</b></span></p>
<p class="akg-fund__rest">目標まで あと <span>4,750,000円</span></p>
<p class="akg-fund__note">いただいたご協賛・ご寄付は、花火の打ち上げ費用と会場の運営に使わせていただきます。大口協賛（10万円以上）・中口協賛（3万円から）・寄付（1万円から）の3つのプランをご用意しています。</p>
</div>
